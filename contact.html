<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>联系方式 · 朱炯</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar" id="navbar">
    <div class="container">
      <a href="index.html" class="nav-logo">朱炯</a>
      <button class="nav-toggle" id="navToggle" aria-label="菜单">
        <span></span><span></span><span></span>
      </button>
      <div class="nav-links" id="navLinks">
        <a href="index.html">首页</a>
        <a href="about.html">关于我</a>
        <a href="projects.html">项目作品</a>
        <a href="contact.html" class="active">联系方式</a>
      </div>
    </div>
  </nav>

  <div class="page-header">
    <h1>联系方式</h1>
    <p>欢迎随时与我取得联系</p>
  </div>

  <section class="section">
    <div class="container">
      <div class="contact-wrap">
        <!-- 左侧表单 -->
        <div class="contact-form fade-in">
          <form id="contactForm">
            <div class="form-group">
              <label for="name">姓名</label>
              <input type="text" id="name" placeholder="请输入您的姓名" required>
            </div>
            <div class="form-group">
              <label for="email">邮箱</label>
              <input type="email" id="email" placeholder="请输入您的邮箱" required>
            </div>
            <div class="form-group">
              <label for="message">留言</label>
              <textarea id="message" placeholder="请写下您想说的话……" required></textarea>
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%">发送消息</button>
          </form>
        </div>

        <!-- 右侧联系信息 -->
        <div class="contact-info fade-in">
          <div class="contact-item">
            <div class="icon">✉</div>
            <div>
              <div class="info-label">电子邮箱</div>
              <div class="info-value">18325976076@163.com</div>
            </div>
          </div>
          <div class="contact-item">
            <div class="icon">📱</div>
            <div>
              <div class="info-label">手机号码</div>
              <div class="info-value">18325976076</div>
            </div>
          </div>
          <div class="contact-item">
            <div class="icon">📍</div>
            <div>
              <div class="info-label">所在地</div>
              <div class="info-value">安徽 · 阜阳</div>
            </div>
          </div>
          <div class="contact-item">
            <div class="icon">💬</div>
            <div>
              <div class="info-label">微信</div>
              <div class="info-value">同手机号</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <footer class="footer">
    <div class="social-links">
      <a href="mailto:18325976076@163.com" title="邮箱">✉</a>
      <a href="#" title="微信">💬</a>
      <a href="contact.html" title="联系我">📞</a>
    </div>
    <p>&copy; 2026 朱炯 · All Rights Reserved</p>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
